10 (35s)",durationSec:35,anchorTag:"1:10 必进真机",stageCue:"快速点明三部分各自职责与隐私红线，准备按 → 提前进入第 3 页线上真机。",cuesSummary:"① cuc-kb 负责公开制度与217处地点（4只读MCP） → ② Live 小智负责手绘Live2D与0.2秒级语音入口 → ③ cuc-cli 仅跑本机查课表待办空教室，凭据不出本机。",scriptSegments:[{tag:"三端职责",text:"围绕这个定位，系统严格切分公共知识与个人数据：核心是云端治理全校公开制度的 cuc-kb，并以 4 个标准只读 MCP 向全校复用；对话前台 Live 小智重写了 React 前端并手绘小智 Live2D，配合双 WebSocket 和连接池压低交互延迟。"},{tag:"隐私边界",text:"而课表、畅课待办和空教室这类涉及统一身份认证的个人数据，则交给零依赖的 cuc-cli 只在用户本机运行、由浏览器本地桥接，认证凭据永不上云。"}]},{id:3,shortLabel:"真机实测",kicker:"ACT 03 · 75s 真机实测（已提前）",title:"线上真机四连测：版本让位 · 地点卡 · 拒答 · 本机补位",window:"1:10–2:25 (75s)",durationSec:75,anchorTag:"1:10 准时真机 · 2:25 必切原理",stageCue:"右侧点选提问卡一键复制，切左侧内嵌 ai.acgurl.cn 发送（推荐顺序 ① → ③ → ④ → ⑤）。",cuesSummary:"点选复制→左侧Ctrl+V：① 导师聘任(版本让位+PDF页码直跳，停4s听原声) → ③ 校医院/教务处(高德地点卡) → ④ 游泳馆票价(标定拒答) → ⑤ 本机cuc-cli(课表/待办/空教室)。",scriptSegments:[{tag:"开场与版本让位 · 0:00–0:30",text:"下面我们在第 1 分 10 秒直接连线上真机实测。先复制第 ① 题问研究生导师聘任要求：可以看到知识库自动压低 2023 旧版，返回带页码的 15 分钟签名 PDF 直跳链接，先听 4 秒实时语音——"},{tag:"操作提示 · 停顿 4 秒放原声",type:"action",text:"（发送第 ① 题后保持微笑，让评委听清 4 秒语音流与 Live2D 口型同步，随后依次复制第 ③、④ 题）"},{tag:"地点卡与标定拒答 · 0:30–0:55",text:"接着复制第 ③ 题查校医院和教务处位置，前端零协议改动渲染出高德交互地点卡；再追问第 ④ 题游泳馆本周五开放与票价，知识库触发标定拒答，如实告知未收录、绝不编造。"},{tag:"本机补位 · 0:55–1:15",text:"最后第 ⑤ 题查个人今日课表、畅课待办和博学楼空教室，由浏览器直连我本机 127.0.0.1 的 cuc-cli 并发查回，凭据不出本机。"}]},{id:4,shortLabel:"硬核三设计",kicker:"ACT 04 · 原理拆解",title:"为什么比普通 RAG 靠谱：三个决定体验的硬设计",window:"2:25–3:20 (55s)",durationSec:55,anchorTag:"2:25 准时拆解",stageCue:"结合刚看完的真机效果，逐条讲清版本让位、条款展开与 217 地点标定。",cuesSummary:"① 四层版本防线：278归档 + 12废止/21重发/30补链降权门控 + 汇编让单行 → ② N=1相邻条款展开+表题注入：证据hit@5 58%→70% → ③ 217地点标定(14.6m) + 4只读MCP(底层BM25 1-3ms/P1缓存40ms)。",scriptSegments:[{tag:"设计一 · 四层版本防线",text:"刚才的效果背后不是简单灌向量库，而是三个硬设计。第一是四层版本防线：278 份旧版与重复件直接归档，人工逐对核验 12 对废止与 21 对逐年重发文件，新版命中时自适应降权并阻断旧版上下文回流，同时汇编让位单行本，点名查旧年份仍可追溯。"},{tag:"设计二与三 · 精准取证与地点 MCP",text:"第二是“找对文件更要找对条款”：把表题注入向量消除纯数字表块丢失，再用相邻条款展开补全前提与例外，把证据级 hit@5 从 58% 提到 70%。第三是经 OSM 17 控制点标定的 217 处地点（中位误差 14.6 米），与全部检索能力一起封装成 4 个标准只读 MCP。",skippableNote:"若接近 3:20 节点，略去 17 控制点等
