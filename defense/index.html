0 (35s)",durationSec:35,anchorTag:"1:10 必进真机",stageCue:"快速点明三部分各自职责与隐私红线，准备按 → 提前进入第 3 页线上真机。",cuesSummary:"① cuc-kb 负责公开制度与217处地点（4只读MCP） → ② Live 小智负责手绘Live2D与0.2秒级语音入口 → ③ cuc-cli 仅跑本机查课表待办空教室，凭据不出本机。",scriptSegments:[{tag:"三端职责",text:"围绕这个定位，系统严格切分公共知识与个人数据：核心是云端治理全校公开制度的 cuc-kb，并以 4 个标准只读 MCP 向全校复用；对话前台 Live 小智重写了 React 前端并手绘小智 Live2D，配合双 WebSocket 和连接池压低交互延迟。"},{tag:"隐私边界",text:"而课表、畅课待办和空教室这类涉及统一身份认证的个人数据，则交给零依赖的 cuc-cli 只在用户本机运行、由浏览器本地桥接，认证凭据永不上云。"}]},{id:3,shortLabel:"真机实测",kicker:"ACT 03 · 75s 真机实测（已提前）",title:"线上真机四连测：版本让位 · 地点卡 · 拒答 · 本机补位",window:"1:10–2:25 (75s)",durationSec:75,anchorTag:"1:10 准时真机 · 2:25 必切原理",stageCue:"右侧点选提问卡一键复制，切左侧内嵌 ai.acgurl.cn 发送（推荐顺序 ① → ③ → ④ → ⑤）。",cuesSummary:"点选复制→左侧Ctrl+V：① 导师聘任(版本让位+PDF页码直跳，停4s听原声) → ③ 校医院/教务处(高德地点卡) → ④ 游泳馆票价(标定拒答) → ⑤ 本机cuc-cli(课表/待办/空教室)。",scriptSegments:[{tag:"开场与版本让位 · 0:00–0:30",text:"下面我们在第 1 分 10 秒直接连线上真机实测。先复制第 ① 题问研究生导师聘任要求：可以看到知识库自动压低 2023 旧版，返回带页码的 15 分钟签名 PDF 直跳链接，先听 4 秒实时语音——"},{tag:"操作提示 · 停顿 4 秒放原声",type:"action",text:"（发送第 ① 题后保持微笑，让评委听清 4 秒语音流与 Live2D 口型同步，随后依次复制第 ③、④ 题）"},{tag:"地点卡与标定拒答 · 0:30–0:55",text:"接着复制第 ③ 题查校医院和教务处位置，前端零协议改动渲染出高德交互地点卡；再追问第 ④ 题游泳馆本周五开放与票价，知识库触发标定拒答，如实告知未收录、绝不编造。"},{tag:"本机补位 · 0:55–1:15",text:"最后第 ⑤ 题查个人今日课表、畅课待办和博学楼空教室，由浏览器直连我本机 127.0.0.1 的 cuc-cli 并发查回，凭据不出本机。"}]},{id:4,shortLabel:"硬核三设计",kicker:"ACT 04 · 原理拆解",title:"为什么比普通 RAG 靠谱：三个决定体验的硬设计",window:"2:25–3:20 (55s)",durationSec:55,anchorTag:"2:25 准时拆解",stageCue:"结合刚看完的真机效果，逐条讲清版本让位、条款展开与 217 地点标定。",cuesSummary:"① 四层版本防线：278归档 + 12废止/21重发/30补链降权门控 + 汇编让单行 → ② N=1相邻条款展开+表题注入：证据hit@5 58%→70% → ③ 217地点标定(14.6m) + 4只读MCP(底层BM25 1-3ms/P1缓存40ms)。",scriptSegments:[{tag:"设计一 · 四层版本防线",text:"刚才的效果背后不是简单灌向量库，而是三个硬设计。第一是四层版本防线：278 份旧版与重复件直接归档，人工逐对核验 12 对废止与 21 对逐年重发文件，新版命中时自适应降权并阻断旧版上下文回流，同时汇编让位单行本，点名查旧年份仍可追溯。"},{tag:"设计二与三 · 精准取证与地点 MCP",text:"第二是“找对文件更要找对条款”：把表题注入向量消除纯数字表块丢失，再用相邻条款展开补全前提与例外，把证据级 hit@5 从 58% 提到 70%。第三是经 OSM 17 控制点标定的 217 处地点（中位误差 14.6 米），与全部检索能力一起封装成 4 个标准只读 MCP。",skippableNote:"若接近 3:20 节点，略去 17 控制点等细节，直接强调“hit@5 58%→70% 与 14.6 米标定误差”。"}]},{id:5,shortLabel:"评测与反直觉",kicker:"ACT 05 · 数据实证",title:"四套独立评测把关：关掉深度思考反而编造减半",window:"3:20–4:10 (50s)",durationSec:50,anchorTag:"4:10 必进收尾",stageCue:"先点右列 268 题达标条，再重点抛“关闭思考反比开启思考编造减半”的反直觉发现。",cuesSummary:"① 268题盲测：97.7%答对、90.7%如实拒答、2.3%编造 → ② 关键对照：开思考答对持平(209/214)但编造翻倍(10对5)、慢1.4倍 → ③ 165题真实探测82%有支撑、锁定25题缺口。",scriptSegments:[{tag:"268 题盲测与反直觉发现",text:"所有改动都先过评测再上线。在 268 题证据级盲测中，214 道可答题答对 97.7%、54 道无答案题 90.7% 如实拒答、编造压到 2.3%。更关键的是思考模式对照：开启思考后答对数完全持平，但编造直接翻倍、耗时慢 1.4 倍，因此生产环境有扎实证据时固定关闭思考。"},{tag:"留出集与真实需求探测",text:"在留出检索集上多答案 hit@5 达到 100%、MRR 0.963；脱离文档按 6 类师生真实提问探测 165 题，82% 有原文支撑，并精准暴露出 25 题语料缺口。",skippableNote:"超时可略去 MRR 数字，直接带出“82% 有原文支撑并锁定 25 题缺口”。"}]},{id:6,shortLabel:"实绩与缺口",kicker:"ACT 06 · 试运行收尾",title:"公网 834 轮试运行：坦诚三个缺口，按缺口补采不盲目调参",window:"4:10–4:50 (40s)",durationSec:40,anchorTag:"4:10 准时收尾 · 4:50 邀测",stageCue:"语速沉稳收尾，讲清试运行实绩、三个坦诚缺口和补采规划，微笑邀请老师现场出题。",cuesSummary:"① 成果：1,090+测试 / 834轮试运行 / ¥2.56嵌入成本 / 4个标准MCP → ② 3缺口：25题生活收费缺口、11-08后增量、真实对话复评 → ③ 计划：按清单补采+周增量+对接信息化部 → ④ 邀测 ai.acgurl.cn。",scriptSegments:[{tag:"试运行实绩与坦诚缺口",text:"截至 11 月 23 日，三端已通过 1,090 项自动化测试，公网试运行 834 轮真实提问，全库向量嵌入仅花费 2.56 元。同时我们坦诚记录下三个缺口：25 题当期活动与收费标准语料缺口、11 月 8 日后的通知时效滞后，以及大规模真实自然问法复评。"},{tag:"务实演进与结束语",text:"接下来我们不做无效调参，直接按缺口清单精准补采、上线官网周级增量与零回归门禁，并争取对接学校信息化部门开放正规统一认证。线上 ai.acgurl.cn 与本机 cuc-cli 均已就绪，欢迎老师们出题实测，谢谢！"}]}],slide1:{giantNumber:"97.7%",thesis:"通用大模型并不知道本校现行制度与实时属性；把 2,290 份校内文件治理成可引用证据，回答质量才真正可靠。",quote:"核心判断：不靠通用模型背校规，让持续治理的 cuc-kb 决定问答上限——查得到、带出处、查不到就明说。",comparisons:[{question:"研究生导师岗位聘任最新有什么要求？",genericAiFailure:"易用 2023 已废止旧文或泛化常识拼凑，无页码依据。",xiaozhiResult:"触发版本让位压低旧版，返回现行文件 + 15 分钟签名 PDF 页码直跳。",proofBadge:"版本让位 · 页码溯源"},{question:"校医院和教务处办事窗口分别在哪栋楼？",genericAiFailure:"易混淆旧址 41 号楼与现址 20 号楼，无法精准导航。",xiaozhiResult:"命中 217 处校园地点坐标层，前端零改动渲染高德 / 百度 / 苹果卡。",proofBadge:"217 地点 · 误差 14.6m"},{question:"学校游泳馆这周五晚开放到几点、票价多少？",genericAiFailure:"顺着常识编造“开放至 21 点、票价 20 元”等虚假属性。",xiaozhiResult:"触发标定拒答：如实告知未收录当期时段与票价，拒绝猜测。",proofBadge:"标定拒答 · 90.7% 拒答" 」防止旧版上下文回流，同时标明已被哪份文件替代；③ 同族新版优先且汇编让位单行本（消融显示关闭后首位命中掉 5–6 题）；④ 若用户明确点名查历史年份（如 2022 版），仍保留可检索。"},{q:"Q2：你们为什么敢在生产环境关掉大模型的“深度思考模式”？",a:"不是拍脑袋，是 268 题证据级对比实测决定的：在 DeepSeek Flash 上关闭思考与开启思考，可答题答对数完全持平（都是 209/214, 97.7%），但开启思考后可答题编造翻倍（10 对 5）、不可答题编造也更多（7 对 4）、单题耗时增加约 1.4 倍（15.8s 对 11.3s）、Token 消耗多约 1.7 倍。因此知识库证据扎实的前提下，关闭思考更准、更快、更省。"},{q:"Q3：怎么保证不是“找对文件但答非所问”？以及怎么做到不编造？",a:"两条核心措施：① 自建 268 题「证据级」盲测集核验前 5 条片段是否含完整答案原文；发现基线仅 58% 后引入 N=1 相邻条款展开补全前提与例外，将证据 hit@5 提升到 70%、端到端答对从 61% 提到 70%。② 拒答阈值在 65 无答案+204 有答案标定集上校准（65 道全拒），MCP 分三档提示模型，重排超时自动降级拒答，不可答题如实拒答率达 90.7%。"},{q:"Q4：校园地点坐标卡的精度可靠吗？需要改后端 WebSocket 协议吗？",a:"可靠且零协议入侵。11-20 上线的 217 处校园地点表，核心楼宇经校方 3D 地图热点与 OSM 17 个控制点做单应性变换标定（留一中位误差仅 14.6 米），内置 WGS-84 / GCJ-02 / BD-09 三套坐标；同时后端未新增任何 WS 字段，前端直接从 kb_search 原文 JSON 提取 places，刷新历史记录也能同源复原地图卡并一键跳高德/百度/苹果地图。"},{q:"Q5：cuc-cli 查教务和校园卡，个人账号密码和原件 PDF 怎么保证安全？",a:"公共与个人彻底分离：个人数据依赖学校统一身份认证，cuc-cli 以零第三方依赖只运行在用户本机（会话存 ~/.cuc-cli），浏览器直连本机 127.0.0.1 反向桥接且群聊不广播，云端永不碰账密、同时禁用 stdio 防 RCE；而知识库源 PDF 存放在私有对象存储桶，须经 Casdoor SSO 或服务 Token 鉴权后才签发 15 分钟短时签名链接。"},{q:"Q6：为什么单次检索 P50 是 1.2–1.35 秒？还能更低吗？",a:"本地工作已经压到极致——手写稀疏倒排 BM25 仅耗时 1–3ms，11-23 上线的 P1 线程安全缓存命中时 Rerank 仅 40ms、Search 为 0ms。冷查 1.2s 的耗时大头在于海外云主机到北京百炼向量/精排接口的网络 RTT；如果需要压到 200ms 级，只需将节点迁至北京近端即可，无需改动检索算法。"}],sop:{dayBefore:["同域与离线校验：确认 https://ai.acgurl.cn/ 与 https://ppt.acgurl.cn/ 登录态正常、本机 cuc-cli 可连通，同时将完整 defense/ 拷入 U 盘做本地备份。","卡表彩排 3 遍：按 P 打开独立演讲台，启动 5 分钟计时器演练，牢记 **1:10（真机）、2:25（原理）、4:10（收尾）** 三个进度灯。"],fiveMinBefore:["双屏扩展（强烈推荐）：投影仪设为“扩展显示”，全屏（F）拖动 index.html 到投影屏；按 P 打开演讲台留在笔记本看逐字稿、计时与 Q&A 弹药库。","单屏镜像：按 N 在当前屏底部开启单屏提词；默认亮色杂志版面适配强光教室，如需关灯暗色按 T 切换。","音频与本地热备：若接入外放音响先在 Slide 3 测一次语音音量；演示第 ⑤ 题请提前本机登录并启动 cuc-server (127.0.0.1:8787) 与 cuc-mcp --http (127.0.0.1:8788)；普通体验测试账号为 test / TestCuc@2026。"],emergencies:[{situation:"内嵌 iframe 未带登录态",action:"同站 https://ppt.acgurl.cn/ 会自动带入 SameSite=Lax Cookie；若首次未登录，点右上「新窗口 ↗」登录一次再点「↻ 刷新」，或直接切右上 localhost:12393 免登录后端。"},{situation:"教室屏蔽外网域名或延迟抖动",action:"1 秒在 Slide 3 顶栏切换到本地免登录后端 http://localhost:12393/
