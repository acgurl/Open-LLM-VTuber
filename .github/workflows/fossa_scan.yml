name: Fossa Scan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  fossa-scan:
    if: github.repository == 'Open-LLM-VTuber/Open-LLM-VTuber'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: fossas/fossa-action@main
        with:
          api-key: ${{ secrets.fossaApiKey }}
