name: CD (image)

# Builds the production image on GitHub and pushes it to GHCR, so the server
# only needs `docker pull` instead of building locally.
#   - main: runs after CI succeeds on that commit (never ships a red build)
#   - v* tags / manual dispatch: builds the selected ref directly
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: cd-image-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    # Upstream publishes its own images (docker-blacksmith.yml); this is for forks.
    if: >-
      github.repository != 'Open-LLM-VTuber/Open-LLM-VTuber' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    # Production runs on ARM64 (Oracle Phoenix); build natively, no QEMU.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image name and tags
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/open-llm-vtuber"
          version="$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          sha="$(git rev-parse --short=7 HEAD)"
          date="$(TZ=Asia/Shanghai date +%Y%m%d)"
          # Same scheme as the hand-built tags on the server: <version>-<sha>-<date>
          tags="${image}:${version}-${sha}-${date}"$'\n'"${image}:sha-${sha}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            tags+=$'\n'"${image}:main"$'\n'"${image}:latest"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags+=$'\n'"${image}:${GITHUB_REF_NAME}"
          fi
          {
            echo "image=${image}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        shell: bash
        env:
          TAGS: ${{ steps.vars.outputs.tags }}
        run: |
          {
            echo "### Pushed image"
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
