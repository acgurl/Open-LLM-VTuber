name: CD (image)

# Builds the production image on GitHub and pushes it to GHCR, so the server
# only needs `docker pull` instead of building locally.
#   - main: runs after CI succeeds on that commit (never ships a red build)
#   - v* tags / manual dispatch: builds the selected ref directly
# Each platform builds natively on its own runner and is pushed by digest;
# the `manifest` job then publishes the multi-arch tags.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: cd-image-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  meta:
    # Upstream publishes its own images (docker-blacksmith.yml); this is for forks.
    if: >-
      github.repository != 'Open-LLM-VTuber/Open-LLM-VTuber' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
      ref: ${{ steps.vars.outputs.ref }}
      tags: ${{ steps.vars.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image name and tags
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/open-llm-vtuber"
          version="$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          sha="$(git rev-parse --short=7 HEAD)"
          date="$(TZ=Asia/Shanghai date +%Y%m%d)"
          # Same scheme as the hand-built tags on the server: <version>-<sha>-<date>
          tags="${image}:${version}-${sha}-${date}"$'\n'"${image}:sha-${sha}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            tags+=$'\n'"${image}:main"$'\n'"${image}:latest"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags+=$'\n'"${image}:${GITHUB_REF_NAME}"
          fi
          {
            echo "image=${image}"
            echo "ref=$(git rev-parse HEAD)"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
            cache_scope: amd64
          # Production (Oracle Phoenix) is ARM64; the default scope shares
          # layers with the CI docker job.
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            cache_scope: buildkit
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.ref }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.meta.outputs.ref }}
          outputs: type=image,name=${{ needs.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,scope=${{ matrix.cache_scope }},mode=max

      - name: Export digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch tags
        shell: bash
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.meta.outputs.image }}
          TAGS: ${{ needs.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(--tag "$tag")
          done <<< "${TAGS}"
          sources=()
          for d in *; do sources+=("${IMAGE}@sha256:${d}"); done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          first="$(head -n1 <<< "${TAGS}")"
          docker buildx imagetools inspect "$first"
          {
            echo "### Pushed image (linux/amd64, linux/arm64)"
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
