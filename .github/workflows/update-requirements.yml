name: Sync Requirements

# requirements*.txt are exported from uv.lock (not re-resolved), so they pin
# exactly what `uv sync --frozen` installs. Only main is synced: running on
# every branch push used to auto-commit onto feature branches.
on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Export default requirements
        run: uv export --frozen --no-hashes --no-dev --no-emit-project -o requirements.txt
      - name: Export bilibili requirements
        run: uv export --frozen --no-hashes --no-dev --no-emit-project --extra bilibili --no-annotate --no-header -o requirements-bilibili.txt
      - name: Commit updated requirements
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update requirements files (bot)"
          file_pattern: |
            requirements.txt
            requirements-bilibili.txt
