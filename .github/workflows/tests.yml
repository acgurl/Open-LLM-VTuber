name: Tests

on: [push, pull_request]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --no-dev
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: uv run --frozen python -m unittest discover -s tests -v
