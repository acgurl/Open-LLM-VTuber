[project]
name = "open-llm-vtuber"
version = "1.2.1"
description = "Talk to any LLM with hands-free voice interaction, voice interruption, and Live2D taking face running locally across platforms"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "anthropic>=0.40.0",
    "azure-cognitiveservices-speech>=1.41.1",
    "chardet>=5.2.0",
    "cartesia>=2.0.0",
    "edge-tts>=7.0.0",
    "elevenlabs>=1.0.0",
    "fastapi[standard]>=0.115.8",
    "groq>=0.13.0",
    "httpx>=0.28.1",
    "langdetect>=1.0.9",
    "loguru>=0.7.2",
    "mcp[cli]>=1.6.0",
    "numpy>=1.26.4",
    "openai>=1.57.4",
    "packaging>=24.0",
    "pydub>=0.25.1",
    "pysbd>=0.3.4",
    "pyttsx3>=2.98",
    "PyJWT[crypto]>=2.10.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "ruamel-yaml>=0.18.10",
    "soundfile>=0.12.1",
    "tomli>=2.2.1",
    "uvicorn[standard]>=0.33.0",
]

[project.optional-dependencies]
bilibili = [
    "aiohttp>=3.10.0",
    "Brotli~=1.1.0",
    "yarl>=1.12.0,<2.0"
]
# Gradio-based TTS clients: cosyvoice_tts, cosyvoice2_tts, spark_tts
gradio-tts = [
    "gradio_client>=1.0.0",
]
# fish_api_tts
fish-audio = [
    "fish-audio-sdk>=1.0.0",
]

[dependency-groups]
# Local tooling only; CI lint runs `uvx pre-commit` and the image uses --no-dev.
dev = [
    "pre-commit>=4.1.0",
    "ruff>=0.8.6",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
extend-select = [
    "B",      # flake8-bugbear: likely bugs
    "UP",     # pyupgrade: modern syntax for the py310 target
    "SIM",    # flake8-simplify
    "PIE",    # flake8-pie
    "C4",     # flake8-comprehensions
    "ASYNC",  # flake8-async
    "RET501", "RET502", "RET505", "RET506",
    "RUF005", "RUF010", "RUF013", "RUF015", "RUF019", "RUF100",
]
ignore = [
    "SIM102",  # nested `if` often mirrors the decision being made
    "SIM105",  # explicit try/except/pass is clearer around task cancellation
    "SIM117",  # nested `with` blocks often read better around long context managers
]
# Ignore E402 (module level import not at top of file) for the run_bilibili_live.py script
per-file-ignores = { "scripts/run_bilibili_live.py" = ["E402"] }

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `prompts/` lives at the repo root and `open_llm_vtuber` under `src/`.
pythonpath = [".", "src"]
