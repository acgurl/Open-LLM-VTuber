# TTS catalog examples / 语音合成清单示例
# Start with tts_models.default.yaml and copy only configured entries into the
# runtime tts_models.yaml (system_config.tts_models_file in conf.yaml).
# 先用 tts_models.default.yaml，再将已配置的条目加入运行时 tts_models.yaml
# （由 conf.yaml 的 system_config.tts_models_file 指定）。
# Each entry needs complete provider settings; nothing is inherited from conf.yaml.
# 每个条目都要填写完整 settings，不从 conf.yaml 继承。

tts_models:
  - id: edge-default
    name: Edge TTS
    provider: edge_tts
    settings:
      voice: en-US-AvaMultilingualNeural

