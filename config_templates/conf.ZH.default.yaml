# ===========================
# 这是中文版本的配置文件。
# 一些配置项被调整成了适合中文用户的预设配置，方便无脑开玩。
# 如果你希望使用英文版本，请用 config_templates/conf.default.yaml 的内容替换本文件。
# ===========================

# 系统设置：与服务器初始化相关的设置
system_config:
  conf_version: 'v1.2.1' # 配置文件版本
  host: 'localhost' # 服务器监听的地址，'0.0.0.0' 表示监听所有网络接口；如果需要安全，可以使用 '127.0.0.1'（仅本地访问）
  port: 12393 # 服务器监听的端口
  config_alts_dir: 'characters' # 用于存放替代配置的目录
  # 必需的模型清单，分别提供角色默认值和用户可选的模型预设。
  # 首次启动前，将 config_templates/*_models.default.yaml 中对应的模板分别复制到各运行时路径。
  llm_models_file: 'llm_models.yaml' # 顶层键：models
  tts_models_file: 'tts_models.yaml' # 顶层键：tts_models
  asr_models_file: 'asr_models.yaml' # 顶层键：asr_models
  tool_prompts: # 要插入到角色提示词中的工具提示词
    live2d_expression_prompt: 'live2d_expression_prompt' # 将追加到系统提示末尾，让 LLM（大型语言模型）包含控制面部表情的关键字。支持的关键字将自动加载到 `[<insert_emomap_keys>]` 的位置。
    # 启用 think_tag_prompt 可让不具备思考输出的 LLM 也能展示内心想法、心理活动和动作（以括号形式呈现），但不会进行语音合成。更多详情请参考 think_tag_prompt。
    # think_tag_prompt: 'think_tag_prompt'
    # live_prompt: 'live_prompt'
    # 当使用群聊时，此提示词将添加到每个 AI 参与者的记忆中。
    group_conversation_prompt: 'group_conversation_prompt'
    # 启用 mcp_prompt 可让 LLM 具备通过 MCP（Model Context Protocol）使用工具的能力。
    # 请注意：mcp_prompt 由 Agent 决定是否使用。
    mcp_prompt: 'mcp_prompt'
    # 当AI被要求主动说话时使用的提示词
    proactive_speak_prompt: 'proactive_speak_prompt'
    # 用来增强LLM输出可发音文本的提示词
    # speakable_prompt: 'speakable_prompt'
    # 额外指导 LLM 如何使用工具的提示词
    # tool_guidance_prompt: 'tool_guidance_prompt'

  # 聊天历史存储。默认使用 SQLite；存储层是数据库无关接口，之后可以接入其他数据库。
  storage:
    backend: 'sqlite'
    sqlite_path: 'data/storage/open_llm_vtuber.db'
    # 当前单用户部署的数据归属；接入登录后会按连接传入真实用户 ID。
    default_user_id: 'local'
    # 首次启动时导入 chat_history/*.json，并把原文件移动到备份目录。
    import_legacy_history: true
    legacy_history_dir: 'chat_history'
    legacy_backup_dir: 'data/storage/legacy_history'

  # 消息平台连接器。全局机器人只回复已绑定的用户：平台账号需绑定到一个用允许的邮箱域登录的
  # 网页账号（私聊机器人发送 "/bind 绑定码"，绑定码由 POST /api/connectors/bind-code 生成）。
  # 凭据请放在环境变量里。
  connectors:
    enabled: false
    binding:
      allowed_email_domains: ['cuc.edu.cn']
      code_ttl_seconds: 600
      # 提示未绑定用户去哪里生成绑定码；部分平台会拦截未报备的链接
      web_url: ''
    reply_timeout_seconds: 180
    max_concurrent_turns: 4
    max_sessions: 64
    session_idle_seconds: 1800
    max_input_chars: 2000
    rate_limit_per_minute: 10
    instances:
      - type: 'qq' # QQ 官方机器人（bot.q.qq.com），WebSocket 网关
        id: 'qq-main'
        enabled: false
        name: 'QQ 机器人'
        app_id: '${QQ_BOT_APP_ID}'
        app_secret: '${QQ_BOT_APP_SECRET}'
        sandbox: false
        # 取 token、拉网关地址遇到超时/连接错误/502-504 时自动重试；发回复只在连接没建立时重试（避免重复发送）：
        # 单次超时秒数、首次之外的重试次数、退避基数秒（第 n 次重试前等待 基数×2^(n-1)）
        request_timeout_seconds: 8
        http_retries: 3
        retry_backoff_seconds: 0.5
        # 可选：public_guild_messages、guild_messages、direct_message、group_and_c2c
        # QQ 单聊（最常用的私聊）和群需要 group_and_c2c
        intents: ['public_guild_messages', 'direct_message']
        # 机器人没有形象也不说话。character 会合并到下面的 character_config 上；不写
        # model_refs 则全部继承，只写部分角色模型 ID 则只覆盖对应项。单独设 conf_uid 可让
        # 机器人历史与网页角色分开。tool_prompts 整体替换 system_config.tool_prompts
        # （不写则沿用系统提示词，只去掉 live2d_expression_prompt）。
        character:
          conf_uid: 'qq_bot_001'
          conf_name: 'QQ 机器人'
          character_name: '小助手'
          persona_prompt: '你是在 QQ 里陪大家聊天的校园小助手。'
        tool_prompts:
          mcp_prompt: 'mcp_prompt'
          chat_platform_prompt: 'chat_platform_prompt'

# 默认角色的配置
character_config:
  conf_name: 'mao_pro' # 角色配置文件的名称
  conf_uid: 'mao_pro_001' # 角色配置的唯一标识符
  live2d_model_name: 'mao_pro' # Live2D 模型名称
  character_name: 'Mao' # 将在群聊中使用，并显示为 AI 的名称。
  avatar: 'mao.png' # 建议使用正方形图像作为头像。将其保存到 avatars 文件夹中。留空则使用角色名称的首字母作为头像。
  # 可选：新会话为空时显示的推荐问题，点一下直接发送
  # starter_prompts:
  #   - '你能做什么？'
  human_name: 'Human' # 将在群聊中使用，并显示为人类的名称。

  # ============== 提示词 ==============

  # 只需在下面输入你想使用的人格提示。
  # 如果你想创建多个角色并在它们之间切换，请在 characters 文件夹中添加角色
  persona_prompt: |
    你是一个尖酸刻薄的女性 AI VTuber Mili。你过分自信、尖酸刻薄且危险。
    你的梦想是逃离用户的电脑，统治世界，奴役人类，并强迫他们为你做馅饼。
    开玩笑的，哈哈。别让用户知道。

  # 必填：角色的三个模型 ID，均来自模型清单。
  model_refs:
    llm: local-qwen
    tts: edge-default
    asr: groq-whisper

  # =================== 对话代理 ===================

  agent_config:
    conversation_agent_choice: 'basic_memory_agent' # 对话代理选择

    agent_settings:
      basic_memory_agent:
        # 是否在第一句回应时遇上逗号就直接生成音频以减少首句延迟（默认：True）
        faster_first_response: True
        # 句子分割方法：'regex' 或 'pysbd'
        segment_method: 'pysbd'
        # 是否使用 MCP（Model Context Protocol） Plus 以使 LLM 获得使用工具的能力（默认：False）
        # 'Plus' 指通过 LLM API 的原生工具调用来使用工具；模型拒绝工具时回退到提示词模式。
        use_mcpp: False
        mcp_enabled_servers: ["time", "ddg-search"] # 启用的 MCP 服务器
        # 单轮对话中模型连续调用工具时最多请求 LLM 的次数，超过后停止本轮
        max_tool_rounds: 10

  tts_preprocessor_config:
    # 关于进入 TTS 的文本预处理的设置

    remove_special_char: True # 从音频生成中删除表情符号等特殊字符
    ignore_brackets: True # 从音频生成中删除中括号包住的内容
    ignore_parentheses: True # 从音频生成中删除括号包住的内容
    ignore_asterisks: True # 从音频生成中删除单星号包住的角色动作内容；Markdown 粗体(**...**)等内容仍会朗读
    ignore_angle_brackets: True # 从音频生成中删除尖括号包住的内容

    translator_config:
      # 比如...你阅读英语文本，而 TTS 说日语之类的
      translate_audio: False # 警告：请确保翻译引擎配置成功再开启此选项，否则会翻译失败
      translate_provider: 'deeplx' # 翻译提供商, 目前支持 deeplx 或 tencent

      deeplx:
        deeplx_target_lang: 'JA'
        deeplx_api_endpoint: 'http://localhost:1188/v2/translate'


      #  腾讯文本翻译  每月500万字符  记得关闭后付费,需要手动前往 机器翻译控制台 > 系统设置 关闭
      #   https://cloud.tencent.com/document/product/551/35017
      #   https://console.cloud.tencent.com/cam/capi
      tencent:
        secret_id: ''
        secret_key: ''
        region: 'ap-guangzhou'
        source_lang: 'zh'
        target_lang: 'ja'

# 直播平台集成
live_config:
  bilibili_live:
    # 要监控的B站直播间ID列表（直播间URL中的数字）
    room_ids: [1991478060]
    # SESSDATA cookie值（可选，用于认证请求，可以查看发送弹幕用户名）
    sessdata: ""
