# User-selectable language and speech presets / 网页端可选的语言模型和语音预设
#
# Copy this file to the project root as `llm_models.yaml` (the path is
# `system_config.llm_models_file` in conf.yaml). Without that file the feature
# is off and every session uses the LLM of its character preset.
# 把本文件复制到项目根目录并命名为 `llm_models.yaml`（路径由 conf.yaml 的
# `system_config.llm_models_file` 指定）。没有这个文件时功能关闭，所有会话都用
# 角色预设自带的 LLM。
#
# - Edits take effect within a few seconds; no restart is needed.
#   修改后几秒内自动生效，不用重启。
# - A user's choice is stored per account and replaces the character's LLM for
#   the web UI and the message connectors. "Character default" in the picker
#   goes back to the preset's own LLM.
#   用户的选择按账号保存，网页端和消息连接器都会用它代替角色预设的 LLM；
#   选择器里的“角色默认”即回到预设自带的 LLM。
# - This file holds API keys: keep it out of git (it is ignored by default)
#   and readable only by the service account. `${ENV_VAR}` is substituted.
#   本文件含 API 密钥：不要提交到 git（默认已忽略），权限设为仅服务账号可读。
#   支持 `${环境变量}` 替换。

models:
  - id: deepseek-chat # stable key stored as the user's choice: letters, digits, . _ : -
    name: DeepSeek Chat # shown in the picker
    description: 响应快，适合日常对话 # optional, shown under the name
    # Any provider of `agent_config.llm_configs` in conf.yaml. The remaining
    # keys are that provider's settings, exactly as in conf.yaml.
    # Providers: openai_compatible_llm (Chat Completions), openai_responses_llm
    # (Responses API), claude_llm, vertex_llm.
    provider: openai_compatible_llm
    base_url: https://api.deepseek.com/v1
    llm_api_key: ${DEEPSEEK_API_KEY}
    model: deepseek-chat
    temperature: 1.0

  - id: deepseek-flash
    name: DeepSeek Flash
    provider: openai_compatible_llm
    base_url: https://api.deepseek.com/v1
    llm_api_key: ${DEEPSEEK_API_KEY}
    model: deepseek-flash
    # Optional reasoning levels, picked with the thinking button in the chat
    # input. `params` are extra request-body fields (the API's own names),
    # merged into every request at that level. A level without `params` uses
    # the provider's standard effort field (Chat Completions: reasoning_effort;
    # Responses: reasoning.effort; Claude: output_config.effort; Vertex:
    # generationConfig.thinkingConfig.thinkingLevel); `off` without `params`
    # adds nothing, so spell out how to disable thinking for models that think
    # by default. A user's choice is stored per account and per model.
    # 可选的思考档位，用户在输入框的思考按钮里选择。`params` 是请求体的额外字段
    # （用该 API 自己的字段名），按档位合并进每次请求。不写 `params` 时用该
    # provider 的标准强度字段；`off` 不写 `params` 则什么都不加，所以默认就会
    # 思考的模型要写明关闭方式。选择按账号、按模型保存。
    thinking:
      default: off
      levels:
        # DeepSeek's documented reasoning_effort values are low / high / max
        # (medium is folded into high server-side, so it is not offered).
        # DeepSeek 文档的 reasoning_effort 取值为 low / high / max（medium 会被服务端并入 high，故不列出）。
        - id: off
          params: {thinking: {type: disabled}}
        - id: low
          name: 轻度思考
          params: {thinking: {type: enabled}, reasoning_effort: low}
        - id: high
          name: 深度思考 # optional; known ids are translated by the UI
          params: {thinking: {type: enabled}, reasoning_effort: high}
        - id: max
          params: {thinking: {type: enabled}, reasoning_effort: max}

  - id: claude
    name: Claude
    description: 仅限指定账号
    provider: claude_llm
    llm_api_key: ${ANTHROPIC_API_KEY}
    model: claude-sonnet-5-5
    # Claude's output_config.effort: low / medium / high / xhigh / max (xhigh and
    # max are per-model; Sonnet 5.5 documents xhigh). Omitted = the model's
    # default (high). `off` adds nothing, so thinking stays off.
    # Claude 的 output_config.effort 取值 low / medium / high / xhigh / max（xhigh、max 按模型支持；
    # Sonnet 5.5 支持 xhigh）。不设即模型默认（high）；`off` 不加任何字段，即关闭思考。
    thinking:
      default: off
      levels: [off, low, medium, high, xhigh]
    # Only these accounts see and can use the model. Same rule as a character
    # preset's `allowed_users`: internal user ids (Settings → Account) or
    # verified login emails; display names are never matched. Omit the key, or
    # leave the list empty, to make the model available to everyone.
    # 只有这些账号能看到并使用该模型。规则与角色预设的 `allowed_users` 相同：
    # 内部 user_id（设置 → 账户）或已验证的登录邮箱，不匹配显示名。
    # 不写或留空表示所有人可用。
    allowed_users:
      - alice@example.com
      - 0123456789abcdef0123456789abcdef

  - id: gpt
    name: GPT
    provider: openai_responses_llm # OpenAI Responses API
    llm_api_key: ${OPENAI_API_KEY}
    model: gpt-5
    reasoning_effort: low
    thinking: # shorthand: reasoning.effort = the level id
      # Without `default`, users start on the "off"/"none" level when there is
      # one (else the first level). 不写 default 时默认“不思考”档（没有则取第一档）。
      levels: [minimal, low, medium, high]

  - id: gemini-flash
    name: Gemini Flash
    provider: vertex_llm
    # Service-account key file from the Google Cloud console. In the Docker
    # image, put it in the mounted conf directory: /app/conf/vertex_credentials.json
    # Google Cloud 控制台下载的服务账号密钥文件；Docker 部署时放进挂载的 conf 目录。
    credentials_file: vertex_credentials.json
    model: gemini-3-flash-preview
    location: global

  - id: local-qwen
    name: 本地 Qwen
    provider: openai_compatible_llm
    base_url: http://localhost:11434/v1
    llm_api_key: not-needed
    model: qwen2.5:latest

# Optional speech presets. Uncomment only working providers that should be
# selectable. Without `settings`, reuse the corresponding provider configured
# under `character_config.tts_config` / `asr_config` in the base conf.yaml.
# 只取消注释你已配好且愿意对用户开放的服务。省略 settings 时，复用基础
# conf.yaml 中 character_config.tts_config / asr_config 的同名服务配置。
