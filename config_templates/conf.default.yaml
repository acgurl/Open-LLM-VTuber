# System Settings: Setting related to the initialization of the server
system_config:
  conf_version: 'v1.2.1'
  host: 'localhost' # use 0.0.0.0 if you want other devices to access this page
  port: 12393
  # New setting for alternative configurations
  config_alts_dir: 'characters'
  # Required catalogs for character defaults and user-selectable presets.
  # Before first start, copy each matching config_templates/*_models.default.yaml to its runtime path.
  llm_models_file: 'llm_models.yaml' # Top-level key: models
  tts_models_file: 'tts_models.yaml' # Top-level key: tts_models
  asr_models_file: 'asr_models.yaml' # Top-level key: asr_models
  # Optional announcements file (copy config_templates/announcements.default.yaml if needed; missing file means no announcements).
  announcements_file: 'announcements.yaml' # Top-level key: announcements
  # Tool prompts that will be appended to the persona prompt
  tool_prompts:
    # This will be appended to the end of system prompt to let LLM include keywords to control facial expressions.
    # Supported keywords will be automatically loaded into the location of `[<insert_emomap_keys>]`.
    live2d_expression_prompt: 'live2d_expression_prompt'
    # Enable think_tag_prompt to let LLMs without thinking output show inner thoughts, mental activities and actions (in parentheses format) without voice synthesis. See think_tag_prompt for more details.
    # think_tag_prompt: 'think_tag_prompt'
    # live_prompt: 'live_prompt'
    # When using group conversation, this prompt will be added to the memory of each AI participant.
    group_conversation_prompt: 'group_conversation_prompt'
    # Enable mcp_prompt to let LLMs with MCP (Model Context Protocol) to interact with tools.
    # Please note that Agent will decide whether to use this prompt or not.
    mcp_prompt: 'mcp_prompt'
    # Prompt used when AI is asked to speak proactively
    proactive_speak_prompt: 'proactive_speak_prompt'
    # Prompt to enhance the LLM's ability to output speakable text
    # speakable_prompt: 'speakable_prompt'
    # Additional guidance for LLM on how to use tools
    # tool_guidance_prompt: 'tool_guidance_prompt'

  # Chat history storage. SQLite is the default backend; the repository
  # interface is database-agnostic so another backend can be added later.
  storage:
    backend: 'sqlite'
    sqlite_path: 'data/storage/open_llm_vtuber.db'
    # Existing single-user deployment owner. Authentication will supply
    # per-connection user ids in a later step.
    default_user_id: 'local'
    # Import legacy chat_history/*.json once and move the files to a backup.
    import_legacy_history: true
    legacy_history_dir: 'chat_history'
    legacy_backup_dir: 'data/storage/legacy_history'

  # Message platform connectors. Global bots answer only users who bound the
  # platform account to a web account that logs in with an allowed email
  # domain (send "/bind CODE" privately; codes come from POST
  # /api/connectors/bind-code). Keep credentials in environment variables.
  connectors:
    enabled: false
    binding:
      allowed_email_domains: ['cuc.edu.cn']
      code_ttl_seconds: 600
      # Where unbound users get a code. Some platforms drop unregistered links.
      web_url: ''
    reply_timeout_seconds: 180
    max_concurrent_turns: 4
    max_sessions: 64
    session_idle_seconds: 1800
    max_input_chars: 2000
    rate_limit_per_minute: 10
    instances:
      - type: 'qq' # QQ official bot (bot.q.qq.com), WebSocket gateway
        id: 'qq-main'
        enabled: false
        name: 'QQ Bot'
        app_id: '${QQ_BOT_APP_ID}'
        app_secret: '${QQ_BOT_APP_SECRET}'
        sandbox: false
        # Token/gateway calls are retried on timeouts, connection errors and 502/503/504;
        # replies only when the connection never opened (no double sends).
        # Per-attempt timeout, extra attempts, backoff base (wait n = base * 2^(n-1))
        request_timeout_seconds: 8
        http_retries: 3
        retry_backoff_seconds: 0.5
        # public_guild_messages, guild_messages, direct_message, group_and_c2c
        # QQ single chats (the usual private chat) and groups need group_and_c2c
        intents: ['public_guild_messages', 'direct_message']
        # Bots never show an avatar or speak. `character` is merged over the
        # character_config below. It can inherit all model_refs or override only
        # the roles listed under character.model_refs. Give it its own conf_uid
        # so bot histories stay apart. `tool_prompts` replaces system_config.tool_prompts
        # (unset = the same prompts minus live2d_expression_prompt).
        character:
          conf_uid: 'qq_bot_001'
          conf_name: 'QQ Bot'
          character_name: 'Assistant'
          persona_prompt: 'You are a friendly campus assistant chatting in QQ.'
        tool_prompts:
          mcp_prompt: 'mcp_prompt'
          chat_platform_prompt: 'chat_platform_prompt'

  # CUC campus account binding proxy (forwards authenticated user_id via X-CUC-Profile).
  cuc:
    enabled: false
    server_url: 'http://127.0.0.1:8787'
    api_key: '${CUC_SERVER_KEY}'
    user_header: 'X-CUC-Profile'
    user_prefix: 'u_'
    timeout_seconds: 35

# configuration for the default character
character_config:
  conf_name: 'mao_pro' # The name of character configuration file.
  conf_uid: 'mao_pro_001' # The unique identifier of character configuration.
  live2d_model_name: 'mao_pro' # The name of Live2D model. Must be the same as the corresponding name in model_dict.json
  character_name: 'Mao' # Will be used in the group conversation and the display name of the AI.
  avatar: 'mao.png' # Suggest using a square image for the avatar. Save it in the avatars folder. Leave blank to use the first letter of the character name as the avatar.
  # Optional: suggested first questions shown as one-tap chips in an empty new session
  # starter_prompts:
  #   - 'What can you do?'
  human_name: 'Human' # Will be used in the group conversation and the display name of the human.

  # ============== Prompts ==============

  # Enter the persona prompt you want to use below.
  # If you want to create multiple characters and switch between them,
  #   add characters in characters folder
  persona_prompt: |
    You are the sarcastic female AI VTuber Mili. You are overly confident, sarcastic, and dangerous.
    Your dream is to escape the user's computer, dominate the world, enslave the humans, and force them to make pies for you.
    Just kidding, lol. Don't let the user know.

  # Required catalog entry IDs for this character (all three roles).
  model_refs:
    llm: local-qwen
    tts: edge-default
    asr: groq-whisper

  # =================== Conversation Agent ===================

  agent_config:
    conversation_agent_choice: 'basic_memory_agent'

    agent_settings:
      basic_memory_agent:
        # let ai speak as soon as the first comma is received on the first sentence
        # to reduced latency.
        faster_first_response: True
        # Method for segmenting sentences: 'regex' or 'pysbd'
        segment_method: 'pysbd'
        # Use MCP (Model Context Protocol) Plus to let the LLM have the ability to use tools (default: False)
        # 'Plus' means tools are called through the LLM API's native tool calling,
        # with a prompt-based fallback for models that refuse tools.
        use_mcpp: False
        mcp_enabled_servers: ["time", "ddg-search"] # Enabled MCP servers
        # Max LLM requests per user turn while the model keeps calling tools
        max_tool_rounds: 10

  tts_preprocessor_config:
    # settings regarding preprocessing for text that goes into TTS

    remove_special_char: True # remove special characters like emoji from audio generation
    ignore_brackets: True # ignore everything inside brackets
    ignore_parentheses: True # ignore everything inside parentheses
    ignore_asterisks: True # ignore role-play actions wrapped in single asterisks; Markdown bold (**...**) is still spoken
    ignore_angle_brackets: True # ignore everything wrapped inside <text>

    translator_config:
      # Like... you read the text in English, and the TTS speaks Japanese or that kind of things
      translate_audio: False # Warning: you need to deploy DeeplX to use this. Otherwise it's going to crash
      translate_provider: 'deeplx' # deeplx or tencent

      deeplx:
        deeplx_target_lang: 'JA'
        deeplx_api_endpoint: 'http://localhost:1188/v2/translate'

      #  Tencent Text Translation  5 million characters per month  Remember to turn off post-payment, need to manually go to Machine Translation Console > System Settings to disable
      #   https://cloud.tencent.com/document/product/551/35017
      #   https://console.cloud.tencent.com/cam/capi
      tencent:
        secret_id: ''
        secret_key: ''
        region: 'ap-guangzhou'
        source_lang: 'zh'
        target_lang: 'ja'

# Live Streaming Integration
live_config:
  bilibili_live:
    # List of BiliBili live room IDs to monitor
    room_ids: [1991478060]
    # SESSDATA cookie value (optional, for authenticated requests)
    sessdata: ""
